name: PhishGuard CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # 1. Lint
  lint:
    name: Lint and Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install flake8

      - name: flake8 syntax check
        run: |
          flake8 App.py incident_report.py Train_Model.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 App.py incident_report.py Train_Model.py \
            --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

  # 2. Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit security scan
        run: |
          bandit -r App.py incident_report.py \
            -ll --skip B104,B311 -f txt

      - name: Check for hardcoded secrets
        run: |
          if grep -rn \
            -e "password\s*=\s*['\"][a-zA-Z0-9]\{8,\}['\"]" \
            -e "secret\s*=\s*['\"][a-zA-Z0-9]\{8,\}['\"]" \
            -e "MONGO_URI\s*=\s*['\"]mongodb+srv://" \
            App.py incident_report.py; then
            echo "FAIL: Potential hardcoded secret found"
            exit 1
          else
            echo "PASS: No hardcoded secrets detected"
          fi

      - name: Check sensitive files are not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env is tracked by git"
            exit 1
          fi
          if git ls-files --error-unmatch users.json 2>/dev/null; then
            echo "FAIL: users.json is tracked by git"
            exit 1
          fi
          echo "PASS: Sensitive files are not tracked"

  # 3. Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov nltk

      - name: Run unit tests
        env:
          MONGO_URI: mongodb://localhost:27017
          FLASK_DEBUG: "false"
          FIELD_ENCRYPT_KEY: ${{ secrets.FIELD_ENCRYPT_KEY }}
        run: |
          pytest tests/test_app.py -v --cov=App --cov-report=term-missing --cov-fail-under=45

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  # 4. Dependency vulnerability check
  deps:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: |
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt --strict

  # 5. Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, security, test, deps]
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt nltk

      - name: Verify App.py syntax
        env:
          FIELD_ENCRYPT_KEY: ${{ secrets.FIELD_ENCRYPT_KEY }}
        run: |
          python -c "
          import ast, sys
          with open('App.py') as f:
              src = f.read()
          try:
              ast.parse(src)
              print('PASS: App.py syntax OK')
          except SyntaxError as e:
              print('FAIL: Syntax error:', e)
              sys.exit(1)
          "

      - name: Verify Flask app starts
        env:
          MONGO_URI: ""
          FIELD_ENCRYPT_KEY: ${{ secrets.FIELD_ENCRYPT_KEY }}
          FLASK_DEBUG: "false"
        run: |
          timeout 10 python App.py &
          sleep 4
          curl -f -X POST http://localhost:5000/login \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"test"}' \
            -o /dev/null -w "%{http_code}" | grep -q "401" && \
            echo "PASS: App started successfully" || \
            (echo "FAIL: App failed to start" && exit 1)